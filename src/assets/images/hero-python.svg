<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-label="Python избавляет от повторяющихся действий">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="55%" stop-color="#F2F7FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3DFC8"/>
      <stop offset="100%" stop-color="#E6C9A8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>

  <!-- Warm sunlit window rays -->
  <circle cx="1220" cy="140" r="220" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="240" cy="640" r="260" fill="#DBEAFE" opacity="0.55"/>
  <circle cx="960" cy="620" r="210" fill="#D1FAE5" opacity="0.5"/>

  <!-- Soft window architecture in background -->
  <rect x="860" y="55" width="490" height="470" rx="28" fill="#FFFFFF" opacity="0.65"/>
  <line x1="1105" y1="55" x2="1105" y2="525" stroke="#E2E8F0" stroke-width="6"/>
  <line x1="860" y1="290" x2="1350" y2="290" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Plant silhouette left -->
  <g transform="translate(80, 440)">
    <path d="M40 220 C20 150, -10 110, 15 65 C35 100, 50 155, 58 220 Z" fill="#10B981" opacity="0.75"/>
    <path d="M55 220 C60 130, 80 70, 120 45 C105 105, 85 160, 74 220 Z" fill="#059669" opacity="0.8"/>
    <path d="M68 220 C95 165, 130 135, 160 125 C135 165, 105 195, 84 220 Z" fill="#34D399" opacity="0.85"/>
    <rect x="24" y="210" width="76" height="82" rx="14" fill="#F97316"/>
    <rect x="16" y="198" width="92" height="22" rx="10" fill="#FB923C"/>
  </g>

  <!-- Desk surface -->
  <rect x="0" y="685" width="1440" height="125" fill="url(#desk)"/>
  <line x1="0" y1="685" x2="1440" y2="685" stroke="#DFC09B" stroke-width="4"/>

  <!-- Left: Scattered raw files / messy cards flowing into the pipeline -->
  <g transform="translate(150, 195) rotate(-8)" filter="url(#softShadow)">
    <rect width="220" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="22" y="24" width="66" height="22" rx="11" fill="#FEE2E2"/>
    <circle cx="36" cy="35" r="5" fill="#EF4444"/>
    <rect x="22" y="64" width="176" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="22" y="88" width="136" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="22" y="112" width="154" height="12" rx="6" fill="#E2E8F0"/>
  </g>

  <g transform="translate(190, 355) rotate(5)" filter="url(#softShadow)">
    <rect width="230" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="22" y="24" width="74" height="22" rx="11" fill="#FEF3C7"/>
    <circle cx="36" cy="35" r="5" fill="#F59E0B"/>
    <rect x="22" y="62" width="186" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="22" y="86" width="144" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="22" y="110" width="110" height="12" rx="6" fill="#E2E8F0"/>
  </g>

  <g transform="translate(135, 505) rotate(-4)" filter="url(#softShadow)">
    <rect width="215" height="128" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="22" y="22" width="68" height="22" rx="11" fill="#DBEAFE"/>
    <circle cx="36" cy="33" r="5" fill="#2563EB"/>
    <rect x="22" y="58" width="166" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="22" y="82" width="128" height="12" rx="6" fill="#E2E8F0"/>
  </g>

  <!-- Smooth animated-feel flow curves from messy files to center engine to clean monitor -->
  <path d="M390 270 C500 270, 500 390, 585 390" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.65"/>
  <path d="M430 425 C500 425, 520 410, 585 410" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.75"/>
  <path d="M365 565 C485 565, 505 430, 585 430" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.7"/>
  <path d="M725 410 L820 410" fill="none" stroke="url(#mintGrad)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="815,396 842,410 815,424" fill="#059669"/>

  <!-- Center: Clean Python Automation Hub Badge -->
  <g transform="translate(585, 330)" filter="url(#shadow)">
    <rect width="145" height="160" rx="32" fill="url(#blueGrad)"/>
    <!-- Stylized interlocking clean blocks -->
    <rect x="34" y="34" width="52" height="44" rx="14" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="6" fill="#2563EB"/>
    <rect x="59" y="82" width="52" height="44" rx="14" fill="#FBBF24"/>
    <circle cx="95" cy="108" r="6" fill="#1E293B"/>
  </g>

  <!-- Right: Wide sleek studio monitor displaying clean verified spreadsheet & checkmarks -->
  <g transform="translate(845, 175)" filter="url(#shadow)">
    <!-- Stand -->
    <rect x="215" y="455" width="76" height="65" rx="10" fill="#CBD5E1"/>
    <rect x="155" y="505" width="196" height="18" rx="9" fill="#94A3B8"/>
    <!-- Screen bezel -->
    <rect width="505" height="465" rx="28" fill="#1E293B"/>
    <rect x="16" y="16" width="473" height="415" rx="18" fill="#FFFFFF"/>

    <!-- Window chrome -->
    <rect x="16" y="16" width="473" height="46" rx="18" fill="#F8FAFC"/>
    <circle cx="44" cy="39" r="7" fill="#FF6B4A"/>
    <circle cx="68" cy="39" r="7" fill="#FBBF24"/>
    <circle cx="92" cy="39" r="7" fill="#10B981"/>
    <rect x="130" y="31" width="210" height="16" rx="8" fill="#E2E8F0"/>

    <!-- Clean table rows -->
    <g transform="translate(38, 86)">
      <!-- Header row -->
      <rect width="429" height="40" rx="10" fill="#EFF6FF"/>
      <rect x="16" y="14" width="84" height="12" rx="6" fill="#2563EB"/>
      <rect x="132" y="14" width="110" height="12" rx="6" fill="#60A5FA"/>
      <rect x="276" y="14" width="72" height="12" rx="6" fill="#60A5FA"/>
      <rect x="372" y="10" width="42" height="20" rx="10" fill="#10B981"/>

      <!-- Row 1 -->
      <rect y="54" width="429" height="46" rx="10" fill="#F8FAFC"/>
      <circle cx="26" cy="77" r="10" fill="#10B981"/>
      <path d="M21 77 L25 81 L32 73" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="71" width="110" height="12" rx="6" fill="#334155"/>
      <rect x="190" y="71" width="96" height="12" rx="6" fill="#94A3B8"/>
      <rect x="342" y="65" width="70" height="24" rx="12" fill="#D1FAE5"/>

      <!-- Row 2 -->
      <rect y="112" width="429" height="46" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>
      <circle cx="26" cy="135" r="10" fill="#10B981"/>
      <path d="M21 135 L25 139 L32 131" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="129" width="128" height="12" rx="6" fill="#334155"/>
      <rect x="190" y="129" width="82" height="12" rx="6" fill="#94A3B8"/>
      <rect x="342" y="123" width="70" height="24" rx="12" fill="#D1FAE5"/>

      <!-- Row 3 -->
      <rect y="170" width="429" height="46" rx="10" fill="#F8FAFC"/>
      <circle cx="26" cy="193" r="10" fill="#10B981"/>
      <path d="M21 193 L25 197 L32 189" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="187" width="98" height="12" rx="6" fill="#334155"/>
      <rect x="190" y="187" width="108" height="12" rx="6" fill="#94A3B8"/>
      <rect x="342" y="181" width="70" height="24" rx="12" fill="#D1FAE5"/>

      <!-- Bottom summary bar -->
      <rect y="236" width="206" height="74" rx="16" fill="#FFF7ED"/>
      <circle cx="36" cy="273" r="18" fill="url(#coralGrad)"/>
      <rect x="68" y="258" width="110" height="12" rx="6" fill="#EA580C"/>
      <rect x="68" y="278" width="76" height="10" rx="5" fill="#FDBA74"/>

      <rect x="222" y="236" width="207" height="74" rx="16" fill="#ECFDF5"/>
      <circle cx="258" cy="273" r="18" fill="url(#mintGrad)"/>
      <path d="M250 273 L256 279 L267 267" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="290" y="258" width="112" height="12" rx="6" fill="#059669"/>
      <rect x="290" y="278" width="84" height="10" rx="5" fill="#6EE7B7"/>
    </g>
  </g>

  <!-- Coffee mug on desk -->
  <g transform="translate(710, 610)" filter="url(#softShadow)">
    <rect width="64" height="76" rx="14" fill="#FFFFFF"/>
    <path d="M64 18 C86 18, 86 56, 64 56" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <rect x="10" y="24" width="44" height="26" rx="8" fill="#FF6B4A"/>
  </g>
</svg>
